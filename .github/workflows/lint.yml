name: Lint

on:
  push

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.14t', '3.15']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
          python-version: ${{ matrix.python-version }}
          # Prerelease CPython ABIs can change; keep 3.15 aligned with current wheels.
          allow-prereleases: true
          check-latest: ${{ matrix.python-version == '3.15' }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv pip install --system -r requirements_dev.txt

    - name: Install the library
      shell: bash
      run: uv pip install --system .

    - name: Run ruff
      shell: bash
      run: ruff check benchset

    - name: Run ruff for tests
      shell: bash
      run: ruff check tests

    - name: Run mypy
      shell: bash
      run: >-
        mypy
        --show-error-codes
        --strict
        --disallow-any-decorated
        --disallow-any-explicit
        --disallow-any-expr
        --disallow-any-generics
        --disallow-any-unimported
        --disallow-subclassing-any
        --warn-return-any
        benchset

    - name: Run mypy for tests
      shell: bash
      run: mypy --exclude '^tests/typing/' tests
